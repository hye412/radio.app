
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radio">
<title>Radio.</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23242522'/%3E%3Ctext x='50' y='65' font-size='53' text-anchor='middle' fill='%23d6b18c' font-family='Arial' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">

<style>
:root {
  color-scheme: light;
  --bg:#f2f0e9;
  --panel:#e7e4db;
  --fg:#292923;
  --sub:#85837a;
  --line:#d9d6cc;
  --accent:#a66c43;
  --active:#e3d3c0;
  --button:#292923;
  --button-text:#f2f0e9;
}

@media(prefers-color-scheme:dark) {
  :root {
    color-scheme:dark;
    --bg:#242522;
    --panel:#30312d;
    --fg:#eeece4;
    --sub:#99988f;
    --line:#41413b;
    --accent:#d6b18c;
    --active:#554638;
    --button:#d6b18c;
    --button-text:#292923;
  }
}

* {box-sizing:border-box}

html,body {
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body {
  min-height:100svh;
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

button,input {font:inherit}

button {cursor:pointer}

.app {
  width:100%;
  max-width:430px;
  min-height:100svh;
  height:100svh;
  height:100dvh;
  padding: max(15px,env(safe-area-inset-top)) 23px
    max(12px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
}

/* Header */

header {
  height:38px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding-bottom:10px;
}

.brand {
  font-size:14px;
  font-weight:900;
  letter-spacing:4px;
}

.status {
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--sub);
  display:flex;
  align-items:center;
  gap:7px;
}

.dot {
  width:7px;
  height:7px;
  background:var(--sub);
  border-radius:50%;
}

.dot.live {background:#55a77a}

/* Main radio */

.main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:clamp(8px,2.2dvh,17px);
}

.logo {
  width:clamp(58px,10dvh,82px);
  height:clamp(58px,10dvh,82px);
  flex-shrink:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  display:grid;
  place-items:center;
  color:var(--accent);
}

.logo svg {
  width:52%;
  height:52%;
}

.station-info {text-align:center}

.station-name {
  font-size:clamp(20px,5vw,25px);
  font-weight:800;
  letter-spacing:-1px;
}

.frequency {
  color:var(--accent);
  font-size:clamp(23px,6vw,30px);
  font-weight:800;
  letter-spacing:2px;
  margin-top:5px;
}

.frequency small {
  font-size:11px;
  color:var(--sub);
  letter-spacing:1px;
}

.dial {
  width:100%;
  padding:11px 0 8px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.dial-label {
  font-size:9px;
  color:var(--sub);
  text-align:center;
  letter-spacing:3px;
  margin-bottom:12px;
}

.dial-scale {
  position:relative;
  height:17px;
  background:repeating-linear-gradient(
    90deg,
    var(--sub) 0px,
    var(--sub) 1px,
    transparent 1px,
    transparent 10%
  );
  background-size:100% 9px;
  background-repeat:no-repeat;
}

.dial-scale:after {
  content:"";
  position:absolute;
  width:2px;
  height:16px;
  background:var(--accent);
  left:50%;
  top:0;
}

/* Playback */

.controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(28px,10vw,45px);
}

.icon-button {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  background:none;
  border:0;
  color:var(--sub);
  padding:0;
}

.icon-button svg {width:21px;height:21px}

.play-button {
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--button);
  color:var(--button-text);
}

.play-button svg {width:25px;height:25px}

/* Sections */

.section {
  flex-shrink:0;
  border-top:1px solid var(--line);
  padding:clamp(9px,1.8dvh,14px) 0;
}

.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:2px;
  color:var(--sub);
  margin-bottom:10px;
}

.stations {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.station {
  min-width:0;
  height:58px;
  background:transparent;
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--fg);
  padding:5px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.station.active {
  background:var(--active);
  border-color:var(--accent);
}

.station strong {
  font-size:11px;
  font-weight:800;
}

.station span {
  font-size:9px;
  color:var(--sub);
}

/* Volume */

.volume-row {
  display:flex;
  align-items:center;
  gap:12px;
}

.volume-row svg {
  width:17px;
  height:17px;
  color:var(--sub);
  flex-shrink:0;
}

input[type=range] {
  flex:1;
  width:0;
  accent-color:var(--accent);
  height:5px;
}

.volume-value {
  width:35px;
  text-align:right;
  font-size:11px;
  color:var(--sub);
  font-variant-numeric:tabular-nums;
}

/* Timer */

.timer-presets {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.timer-btn {
  height:35px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--fg);
  border-radius:5px;
  font-size:11px;
}

.timer-btn.active {
  border-color:var(--accent);
  background:var(--active);
  color:var(--accent);
}

.custom-row {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.custom-row input {
  flex:1;
  width:0;
  min-width:0;
  height:33px;
  padding:0 9px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--fg);
  border-radius:5px;
  font-size:11px;
}

.custom-row button {
  border:0;
  border-radius:5px;
  padding:0 14px;
  background:var(--button);
  color:var(--button-text);
  font-size:11px;
}

.timer-info {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:9px;
  min-height:22px;
  color:var(--sub);
  font-size:10px;
}

.timer-time {
  font-size:17px;
  font-weight:700;
  color:var(--fg);
  font-variant-numeric:tabular-nums;
}

.timer-actions {
  display:flex;
  gap:8px;
}

.timer-actions button {
  border:0;
  background:none;
  color:var(--accent);
  font-size:10px;
  padding:4px;
}

[hidden] {display:none!important}

footer {
  flex-shrink:0;
  text-align:center;
  font-size:8px;
  letter-spacing:3px;
  color:var(--sub);
  padding-top:5px;
}

button:focus-visible,input:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:3px;
}

/* Small screens */

@media(max-height:680px) {
  .app {padding-top:8px;padding-bottom:6px}
  .main {gap:7px}
  .logo {width:49px;height:49px;border-radius:15px}
  .section {padding:7px 0}
  .station {height:49px}
  .play-button {width:52px;height:52px}
  .section-heading {margin-bottom:7px}
  .timer-btn {height:30px}
  .custom-row {margin-top:5px}
  footer {display:none}
}

@media(max-height:560px) {
  .main {flex-direction:row;flex-wrap:wrap;gap:8px}
  .dial {display:none}
  .logo {width:40px;height:40px}
  .controls {gap:12px}
  .play-button {width:44px;height:44px}
  .section {padding:5px 0}
  .station {height:42px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">RADIO.</div>
  <div class="status">
    <span class="dot" id="statusDot"></span>

  </div>
</header>

<main class="main">

  <div class="logo" id="logo">
    <svg viewBox="0 0 48 48" fill="none"

      <path d="M8 19h32v23H8z"/>

</main>

<section class="section">

<section class="section">

    <input type="range" id="volume" min="0" max="100" value="100">

</section>

<section class="section">
  <div class="section-heading">

  </div>

  <div class="timer-presets">
    <button class="timer-btn" data-min="15">15분</button>

    <button class="timer-btn" data-min="45">45분</button>
    <button class="timer-btn" data-min="60">60분</button>
    <button class="timer-btn" data-min="90">90분</button>
  </div>

  <div class="custom-row">
    <input id="customMinutes" type="number"
      min="1" max="720" placeholder="직접 입력 (분)">
    <button id="customStart">설정</button>
  </div>

  <div class="timer-info">
    <span id="timerLabel">타이머 설정 안 됨</span>
    <span class="timer-time" id="timerTime">--:--</span>
    <div class="timer-actions">
      <button id="extendTimer" hidden>+15분</button>
      <button id="cancelTimer" hidden>취소</button>
    </div>
  </div>
</section>

<footer>YOUR PERSONAL RADIO</footer>

<audio id="audio" preload="none" playsinline></audio>

</div>

<script>
const stations = [
  {
    id:"cbs981",
    name:"CBS 표준FM",
    short:"CBS",
    freq:"98.1",
    url:"https://m-aac.cbs.co.kr/mweb_cbs981/_definst_/cbs981.stream/playlist.m3u8"
  },
  {
    id:"cbs939",
    name:"CBS 음악FM",
    short:"CBS",
    freq:"93.9",
    url:"https://m-aac.cbs.co.kr/mweb_cbs939/_definst_/cbs939.stream/playlist.m3u8"
  },
  {
    id:"febc",
    name:"FEBC 극동방송",
    short:"FEBC",
    freq:"서울",
    url:"http://mlive2.febc.net:1935/live/seoulfm/playlist.m3u8"
  },
  {
    id:"kbs",
    name:"KBS 클래식FM",
    short:"KBS",
    freq:"93.1",
    url:"https://1fm.gscdn.kbs.co.kr/1fm_192_2.m3u8?Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly8xZm0uZ3NjZG4ua2JzLmNvLmtyLyoiLCJDb25kaXRpb24iOnsiRGF0ZUxlc3NUaGFuIjp7IkFXUzpFcG9jaFRpbWUiOjE3OTQ3ODY2MzB9fX1dfQ__&Key-Pair-Id=APKAICDSGT3Y7IXGJ3TA&Signature=c5KHNhu8OU9pTE0uHirzZiauF~TU9lkJvX290MOJ3uc47bv45QO69~NJSZDoaJdKQ2lUQciGNavKHiA0kBtCvMfqVp3RuQ5948pz2PlW9dxRzWA5-FTyVpdT~odXBJx1io8WbSomGsbm-EIz2ovfyI95V~Pca0bNA11lrYkC9Am9pNHnsrVGHPB2eovZeK~yzIbkV6GJMB7mAQLFVlthrNE3X8eFT2CjT6apxnaMvNHRLnsV2~A8bPtzrDTQZtoMSnhLece8CnTjedciRCUlbydfo9128xW6tOlmM77L3lpKwKR9hgAoX2edy5zQCCOE4u4xRxRjS~i0nRGHocHX6g__"
  }
];

const $ = id => document.getElementById(id);
const audio = $("audio");

  
// 시스템 미디어 플레이어 연동
function createStationArtwork(station) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#242522";
  ctx.fillRect(0, 0, 512, 512);

  ctx.strokeStyle = "#D6B18C";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.roundRect(35, 35, 442, 442, 70);
  ctx.stroke();

  ctx.fillStyle = "#D6B18C";
  ctx.font = "bold 105px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(station.short, 256, 220);

  ctx.fillStyle = "#F2F0E9";
  ctx.font = "bold 35px Arial";
  ctx.fillText("RADIO", 256, 325);

  ctx.fillStyle = "#99988F";
  ctx.font = "23px Arial";
  ctx.fillText(station.freq + " MHz", 256, 385);

  return canvas.toDataURL("image/png");
}

function updateMediaMetadata() {
  if (!("mediaSession" in navigator)) return;

  const station = stations[current];

  navigator.mediaSession.metadata = new MediaMetadata({
    title: station.name,
    artist: station.short,
    album: "RADIO · LIVE BROADCAST",
    artwork: [
      {
        src: createStationArtwork(station),
        sizes: "512x512",
        type: "image/png"
      }
    ]
  });
}

// 잠금 화면 재생 버튼 연동
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", async () => {
    try {
      if (!audio.src && !hls) {
        await startPlayback();
      } else {
        await audio.play();
      }
      setPlayState(true);
      setStatus("ON AIR", true);
    } catch (e) {
      setStatus("ERROR");
    }
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
    setPlayState(false);
    setStatus("PAUSED");
  });

  navigator.mediaSession.setActionHandler("stop", () => {
    requestId++;
    destroyStream();
    setPlayState(false);
    setStatus("STOPPED");
  });
}

  
let current = 0;
let hls = null;
let HlsClass = null;
let loadingLibrary = null;
let requestId = 0;
let retryCount = 0;
let retryTimer = null;
let timerInterval = null;
let timerDeadline = null;
let baseVolume = 1;
let favorites = JSON.parse(localStorage.getItem("radioFavorites") || "[]");

const playIcon = `
<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M8 5v14l11-7z"/>
</svg>`;

const pauseIcon = `
<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
</svg>`;

function setStatus(text, live=false) {
  $("status").textContent = text;
  $("statusDot").classList.toggle("live",live);
}

function renderStations() {
  $("stations").innerHTML = stations.map((s,i) => `
    <button class="station ${i===current?"active":""}"
      data-index="${i}">
      <strong>${s.short}</strong>
      <span>${s.freq}${s.freq==="서울"?"":" MHz"}</span>
    </button>
  `).join("");

  document.querySelectorAll(".station").forEach(btn => {
    btn.addEventListener("click", () => {
      selectStation(Number(btn.dataset.index));
    });
  });
}

function updateInfo() {
  const s = stations[current];

  $("stationName").textContent = s.name;
  $("frequency").textContent = s.freq;

  $("favoriteBtn").style.color =
    favorites.includes(s.id) ? "var(--accent)" : "var(--sub)";

  $("favoriteLabel").textContent =
    favorites.includes(s.id) ? "★ FAVORITE" : "ALL CHANNELS";

  renderStations();
}

function setPlayState(playing) {
  $("playBtn").innerHTML = playing ? pauseIcon : playIcon;
  $("playBtn").setAttribute("aria-label",playing?"일시정지":"재생");
}

function destroyStream() {
  clearTimeout(retryTimer);
  retryTimer = null;

  if(hls) {
    hls.destroy();
    hls = null;
  }

  audio.pause();
  audio.removeAttribute("src");
  audio.load();
}

async function loadHls() {
  if(HlsClass) return HlsClass;

  if(!loadingLibrary) {
    loadingLibrary = import(
      "https://cdn.jsdelivr.net/npm/hls.js@1/+esm"
    ).then(module => {
      HlsClass = module.default;
      return HlsClass;
    }).finally(() => {
      loadingLibrary = null;
    });
  }

  return loadingLibrary;
}

async function selectStation(index) {
  current = index;
  retryCount = 0;
  requestId++;

  destroyStream();
  updateInfo();

  localStorage.setItem("radioLastStation",stations[current].id);

  setPlayState(false);
  setStatus("READY");

  await startPlayback();
}

async function startPlayback() {
  const id = ++requestId;
  const station = stations[current];

  clearTimeout(retryTimer);
  destroyCurrentHlsOnly();

  setStatus("LOADING");
  setPlayState(false);

  try {
    if(audio.canPlayType("application/vnd.apple.mpegurl")) {
      audio.src = station.url;
      audio.load();

      if(id !== requestId) return;

      await audio.play();
    } else {
      const Hls = await loadHls();

      if(id !== requestId) return;

      if(!Hls.isSupported()) {
        throw new Error("이 브라우저는 HLS를 지원하지 않습니다.");
      }

      const instance = new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        maxBufferLength:15,
        maxMaxBufferLength:30
      });

      hls = instance;

      await new Promise((resolve,reject) => {
        let finished = false;

        const fail = error => {
          if(finished) return;
          finished = true;
          reject(error);
        };

        instance.on(Hls.Events.ERROR,(_,data) => {
          if(data.fatal) fail(new Error(data.details));
        });

        instance.on(Hls.Events.MANIFEST_PARSED,async () => {
          if(id !== requestId) return fail(new Error("취소됨"));

          try {
            await audio.play();
            if(!finished) {
              finished = true;
              resolve();
            }
          } catch(error) {
            fail(error);
          }
        });

        instance.loadSource(station.url);
        instance.attachMedia(audio);
      });
    }

    if(id !== requestId) return;

    retryCount = 0;
    setPlayState(true);
    setStatus("ON AIR",true);

  } catch(error) {
    if(id !== requestId) return;

    console.error("Stream error:",error);

    setPlayState(false);
    setStatus("ERROR");

    if(retryCount < 3) {
      retryCount++;
      const delay = retryCount * 4000;

      setStatus("RECONNECT");
      retryTimer = setTimeout(() => {
        if(id === requestId) startPlayback();
      },delay);
    }
  }
}

function destroyCurrentHlsOnly() {
  if(hls) {
    hls.destroy();
    hls = null;
  }
}

// Playback controls

$("playBtn").addEventListener("click",async () => {
  if(!audio.paused) {
    audio.pause();
    setPlayState(false);
    setStatus("PAUSED");
  } else if(audio.src || hls) {
    try {
      await audio.play();
      setPlayState(true);
      setStatus("ON AIR",true);
    } catch(error) {
      startPlayback();
    }
  } else {
    startPlayback();
  }
});

$("stopBtn").addEventListener("click",() => {
  requestId++;
  destroyStream();
  setPlayState(false);
  setStatus("STOPPED");
});

audio.addEventListener("playing",() => {
  setPlayState(true);
  setStatus("ON AIR",true);
});

audio.addEventListener("waiting",() => {
  if(!audio.paused) setStatus("BUFFERING");
});

audio.addEventListener("error",() => {
  if(audio.src && !audio.paused) {
    setStatus("ERROR");
  }
});

// Volume and fade out

function applyVolume() {
  let fade = 1;

  if(timerDeadline !== null) {
    const remaining = Math.max(0,timerDeadline-Date.now());
    fade = Math.min(1,remaining/60000);
  }

  audio.volume = Math.max(0,Math.min(1,baseVolume*fade));
}

$("volume").addEventListener("input",() => {
  baseVolume = Number($("volume").value)/100;
  $("volumeValue").textContent = $("volume").value+"%";

  localStorage.setItem("radioVolume",$("volume").value);
  applyVolume();
});

// Sleep timer

function startTimer(minutes) {
  if(!Number.isFinite(minutes) || minutes < 1 || minutes > 720) {
    alert("1분에서 720분 사이로 설정해 주세요.");
    return;
  }

  clearInterval(timerInterval);

  timerDeadline = Date.now() + minutes*60000;

  document.querySelectorAll(".timer-btn").forEach(btn => {
    btn.classList.toggle(
      "active",
      Number(btn.dataset.min)===minutes
    );
  });

  $("timerLabel").textContent = "취침 타이머 작동 중";
  $("cancelTimer").hidden = false;
  $("extendTimer").hidden = false;

  updateTimer();
  timerInterval = setInterval(updateTimer,250);
}

function updateTimer() {
  if(timerDeadline === null) return;

  const remaining = Math.max(0,timerDeadline-Date.now());
  const seconds = Math.ceil(remaining/1000);

  const min = Math.floor(seconds/60);
  const sec = seconds%60;

  $("timerTime").textContent =
    String(min).padStart(2,"0")+":"+
    String(sec).padStart(2,"0");

  applyVolume();

  if(remaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    timerDeadline = null;

    requestId++;
    destroyStream();

    audio.volume = baseVolume;
    setPlayState(false);
    setStatus("TIMER ENDED");

    $("timerLabel").textContent = "재생 종료";
    $("timerTime").textContent = "00:00";
    $("cancelTimer").hidden = true;
    $("extendTimer").hidden = true;

    document.querySelectorAll(".timer-btn").forEach(btn =>
      btn.classList.remove("active")
    );
  }
}

function cancelTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerDeadline = null;

  audio.volume = baseVolume;

  $("timerLabel").textContent = "타이머 설정 안 됨";
  $("timerTime").textContent = "--:--";
  $("cancelTimer").hidden = true;
  $("extendTimer").hidden = true;

  document.querySelectorAll(".timer-btn").forEach(btn =>
    btn.classList.remove("active")
  );
}

document.querySelectorAll(".timer-btn").forEach(btn => {
  btn.addEventListener("click",() => {
    startTimer(Number(btn.dataset.min));
  });
});

$("customStart").addEventListener("click",() => {
  const value = Number($("customMinutes").value);
  startTimer(value);
});

$("customMinutes").addEventListener("keydown",event => {
  if(event.key==="Enter") {
    $("customStart").click();
  }
});

$("cancelTimer").addEventListener("click",cancelTimer);

$("extendTimer").addEventListener("click",() => {
  if(timerDeadline !== null) {
    const remaining = Math.max(0,timerDeadline-Date.now());
    startTimer(remaining/60000+15);
  }
});

// Favorites

$("favoriteBtn").addEventListener("click",() => {
  const id = stations[current].id;

  if(favorites.includes(id)) {
    favorites = favorites.filter(x=>x!==id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("radioFavorites",JSON.stringify(favorites));
  updateInfo();
});

// Initial settings

const savedStation = localStorage.getItem("radioLastStation");
const savedIndex = stations.findIndex(s=>s.id===savedStation);

if(savedIndex>=0) current = savedIndex;

const savedVolume = localStorage.getItem("radioVolume");

if(savedVolume !== null && Number.isFinite(Number(savedVolume))) {
  $("volume").value = savedVolume;
  baseVolume = Number(savedVolume)/100;
}

audio.volume = baseVolume;
$("volumeValue").textContent = $("volume").value+"%";

updateInfo();

// Keep countdown accurate after returning from background
document.addEventListener("visibilitychange",() => {
  if(!document.hidden && timerDeadline !== null) {
    updateTimer();
  }
});

</script>
</body>
</html>
