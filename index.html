<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radio">
<title>Radio.</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/style.css">
</head>
<body><div class="app">
<header><div class="brand">RADIO.</div><div class="header-right"><button class="pip-btn" id="pipButton" type="button">미니 플레이어</button><div class="status"><span class="dot" id="dot"></span><span id="status">READY</span></div></div></header>
<section class="player">
 <div class="logo">♫</div><div class="station-name" id="currentName">CBS 표준FM</div><div class="station-meta" id="currentMeta">98.1 MHz · CBS</div>
 <div class="controls"><button class="icon-btn" id="stop" aria-label="정지">■</button><button class="play-btn" id="play" aria-label="재생">▶</button><button class="icon-btn" id="currentStar" aria-label="즐겨찾기">☆</button></div>
</section>
<section class="volume">
 <div class="section-head"><span>음량</span><span id="volumeText">100%</span></div>
 <div class="volume-row"><span aria-hidden="true">◖))</span><input id="volume" type="range" min="0" max="100" value="100"><span class="volume-value" id="volumeValue">100%</span></div>
 <div id="volumeNote" class="note">기본 음량 100%</div>
</section>
<section class="timer">
 <div class="section-head"><span>취침 예약</span><span>FADE OUT · 60 SEC</span></div>
 <div class="presets"><button class="timer-btn" data-min="15">15분</button><button class="timer-btn" data-min="30">30분</button><button class="timer-btn" data-min="45">45분</button><button class="timer-btn" data-min="60">60분</button><button class="timer-btn" data-min="90">90분</button></div>
 <div class="custom-row"><input id="custom" type="number" min="1" max="720" placeholder="직접 입력 (분)"><button id="customSet">설정</button></div>
 <div class="timer-status"><span id="timerLabel">예약 꺼짐</span><span class="timer-time" id="timerTime">--:--</span><span class="timer-actions"><button id="extend" hidden>+15분</button><button id="cancel" hidden>취소</button></span></div>
</section>
<section class="channels">
 <div class="section-title"><span>즐겨찾기</span><span id="favCount">0</span></div><div id="favorites" class="station-list"><div class="empty">별표를 선택하면 즐겨찾기에 추가됩니다.</div></div>
 <div class="section-title" style="margin-top:22px"><span>방송 채널</span><span id="channelCount">0</span></div>
 <input id="search" class="search" type="search" placeholder="방송국 이름 검색">
 <div id="allChannels"></div>
 <div class="note warn">※ 경고: 일부 방송은 스트리밍 주소의 유효기간 만료 또는 방송사 정책 변경으로 재생이 중단될 수 있습니다.</div>
</section>
<footer>PERSONAL RADIO</footer>
<audio id="audio" preload="none" playsinline></audio>
</div>
<script type="module" src="./js/app.js"></script></body></html>
